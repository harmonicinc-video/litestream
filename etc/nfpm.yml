name: "litestream"
arch: "${GOARCH}"
platform: "${GOOS}"
version: "${LITESTREAM_VERSION}"
section: "default"
priority: "extra"
maintainer: "Harmonic Internal"
description: Litestream is a tool for real-time replication of SQLite databases.
homepage: "https://github.com/harmonicinc-video/litestream"
license: "Apache 2"
contents:
- src: ./litestream
  dst: /usr/bin/litestream
- src: ./litestream.yml
  dst: /etc/litestream.yml
  type: config
- src: ./litestream.service
  dst: /usr/lib/systemd/system/litestream.service
  type: config
