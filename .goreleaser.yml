version: 2

project_name: litestream

before:
  hooks:
    - go mod tidy

builds:
  - id: litestream
    main: ./cmd/litestream
    binary: litestream
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "6"
      - "7"
    ldflags:
      - -s -w -X main.Version={{.Version}}
    ignore:
      - goos: darwin
        goarch: arm

archives:
  - id: main
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - etc/litestream.yml
      - etc/litestream.service
      - README.md
      - LICENSE

nfpms:
  - vendor: Litestream
    homepage: https://github.com/harmonicinc-video/litestream
    maintainer: Harmonic Internal
    description: Streaming replication for SQLite databases
    license: Apache 2.0
    formats:
      - deb
      - rpm
    contents:
      - src: etc/litestream.yml
        dst: /etc/litestream.yml
        type: config
      - src: etc/litestream.service
        dst: /lib/systemd/system/litestream.service
        type: config
    bindir: /usr/bin
    file_name_template: >-
      {{ .ProjectName }}-
      {{- .Version }}-
      {{- .Os }}-
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - 'Merge pull request'
      - 'Merge branch'

release:
  github:
    owner: harmonicinc-video
    name: litestream
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Platform Support

    ✅ **Supported Platforms**: Linux (amd64, arm64, armv6, armv7), macOS (amd64, arm64)

    ## Installation

    ### Debian/Ubuntu
    Download the `.deb` file for your architecture and install:
    ```bash
    sudo dpkg -i litestream-*.deb
    ```

    ### RPM-based systems
    Download the `.rpm` file for your architecture and install:
    ```bash
    sudo rpm -i litestream-*.rpm
    ```

    ### Binary installation
    Download the appropriate archive for your platform, extract, and move to your PATH.

sboms:
  - artifacts: archive